services:
  easy_proxies:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: https://goproxy.cn,direct
    image: easy_proxies:dev
    container_name: easy_proxies_dev
    restart: unless-stopped
    environment:
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-9091}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    ports:
      - "${MANAGEMENT_PORT:-9091}:${MANAGEMENT_PORT:-9091}"
      # Optional proxy listener ports for pool/hybrid and multi-port modes.
      # - "2323:2323"
      # - "24000-24100:24000-24100"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
