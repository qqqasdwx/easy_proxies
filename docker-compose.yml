services:
  easy_proxies:
    image: ghcr.io/qqqasdwx/easy_proxies:latest
    container_name: easy_proxies
    restart: unless-stopped
    environment:
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-9091}
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    ports:
      - "${MANAGEMENT_PORT:-9091}:${MANAGEMENT_PORT:-9091}"
      # Enable these only after configuring proxy listeners from the WebUI.
      # - "2323:2323"
      # - "24000-24200:24000-24200"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
